<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mental Health Support</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

  <div class="chat-wrapper">

    <!-- Header -->
    <div class="chat-header">
      <div class="header-left">
        <div class="header-icon">
          <img src="/static/icons/brain.svg" alt="brain icon"/>
        </div>
        <div class="header-info">
          <span class="header-title">Mental Health Support</span>
          <span class="header-status">
            <span class="status-dot"></span>Online
          </span>
        </div>
      </div>
      <button class="theme-toggle" id="themeToggle" title="Toggle theme">
        <!-- sun icon -->
        <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41
                   M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <!-- moon icon -->
        <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>

    <!-- Messages -->
    <div class="chat-messages" id="chatMessages">
      <div class="message bot-message">
        <div class="message-bubble">
          Hello! I'm here to support you. How are you feeling today?
        </div>
        <span class="message-time" data-time="now"></span>
      </div>
    </div>

    <!-- Input -->
    <div class="chat-input-area">
      <div class="input-wrapper">
        <textarea id="userInput" placeholder="Type your message..."
                  rows="1" maxlength="500"></textarea>
        <button id="sendBtn" class="send-btn" title="Send">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13"/>
            <path d="M22 2L15 22 11 13 2 9l20-7z"/>
          </svg>
        </button>
      </div>
      <div class="input-meta">
        <span id="charCount">0/500</span>
      </div>
    </div>

  </div>

  <script src="/static/js/chat.js"></script>
</body>
</html>
